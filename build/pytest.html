<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script></head><body><h id="loading-element">Loading</h><script type="text/javascript">async function main(){let pyodide = await loadPyodide();console.log(pyodide.runPython(`
from js import *
import asyncio
import pyodide_js
from pyodide.ffi import create_proxy
import math, sys

pressed_keys = set()

def on_keydown(event):
    pressed_keys.add(event.key)

def on_keyup(event):
    pressed_keys.discard(event.key)

keydown_proxy = create_proxy(on_keydown)
keyup_proxy = create_proxy(on_keyup)

document.addEventListener("keydown", keydown_proxy)
document.addEventListener("keyup", keyup_proxy)

def key_pressed(key_name):
    return key_name in pressed_keys

def get_mouse_position(event):
    global mouse_x, mouse_y
    mouse_x = event.clientX
    mouse_y = event.clientY

mouse_proxy = create_proxy(get_mouse_position)

document.addEventListener("mousemove", mouse_proxy)

mouse_x = 0
mouse_y = 0

def mouse_pos():
    global mouse_x, mouse_y
    return mouse_x, mouse_y

async def main():
    element = document.getElementById("loading-element")
    element.textContent = "Pyodide Loaded"
    element.style.color = "red"
    element.style.position = 'absolute'
    element.style.fontSize = "50px"
    element.style.left = '0px'
    element.style.top = '0px'
    x = 100
    y = 100
    run_speed = 3
    tracking_interval = 4
    while True:
        if key_pressed('w'):
            y = y - tracking_interval
        if key_pressed('a'):
            x = x - tracking_interval
        if key_pressed('s'):
            y = y + tracking_interval
        if key_pressed('d'):
            x = x + tracking_interval
        if key_pressed('i'):
            gif_x = 0
            gif = document.createElement("div")
            gif.innerHTML = """<img src="https://media1.tenor.com/m/wCxmu-WUQo4AAAAd/yaai-virus.gif" alt="GIF" />"""
            document.body.appendChild(gif)
            gif.style.position = 'absolute'
            for i in range(100):
                gif_x = gif_x + 10
                gif.style.left = f"{gif_x}"
                await asyncio.sleep(0.01)


        mouse_position_tuple = mouse_pos()
        client_mouse_x = mouse_position_tuple[0]
        client_mouse_y = mouse_position_tuple[1]
        delta_x = client_mouse_x - x
        delta_y = client_mouse_y - y
        distance_away = math.sqrt(math.pow(delta_x, 2) + math.pow(delta_y, 2))
        element.textContent = 'Python running in the web browser'
        if distance_away < 100:
            while not run_speed > delta_x > -run_speed or not run_speed > delta_y > -run_speed:
                delta_y = delta_y / 2
                delta_x = delta_x / 2
            x = x - delta_x
            y = y - delta_y

        element.style.left = f"{x}px"
        element.style.top = f"{y}px"
        element.style.fontSize = f"{50}px"
        await asyncio.sleep(0.01)
main()
`));}main();</script></body></html>
